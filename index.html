<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Search Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Product Search Application</h1>
        <p>Search products from a live API</p>
    </header>

    <main>
        <form id="searchForm">
            <input
                type="text"
                id="searchInput"
                placeholder="Search for products..."
            >
            <button type="submit">Search</button>
        </form>

        <p id="status"></p>

        <div id="productContainer" class="product-container"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
